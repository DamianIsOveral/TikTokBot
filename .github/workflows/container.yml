name: Container checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_ENABLED: 'false'
      LIVE_AUTO_CONNECT: 'false'
      LIVE_AUTO_RECONNECT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-tracked.ts
      - name: Validate private Coolify Compose with fictional credentials
        run: docker compose -f compose.coolify.yaml config --quiet
        env:
          EULER_API_KEY: CI_FAKE
          TIKTOK_SESSION_ID: CI_FAKE
          TIKTOK_TARGET_IDC: test
          TIKTOK_MS_TOKEN: CI_FAKE
          TIKTOK_VERIFY_FP: verify_CI_FAKE
          DISCORD_CLIENT_ID: '100000000000000001'
          DISCORD_CLIENT_SECRET: CI_FAKE
          DISCORD_ADMIN_IDS: '100000000000000001'
      - name: Build with public pinned signing assets
        run: docker build --tag faynominaal-ci:local .
      - name: Check private container and persistent storage
        run: node scripts/container-smoke.ts faynominaal-ci:local
