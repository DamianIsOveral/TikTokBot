services:
  dashboard:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 127.0.0.1
    network_mode: host
    volumes:
      - dashboard-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64

volumes:
  dashboard-data:
